<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>State Chart Diagram</title>

<style>
    body {
        margin: 0;
        padding: 30px;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
    }

    .page {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    svg {
        width: 100%;
        height: auto;
        border: 1px solid #ddd;
        background: white;
    }

    .state {
        fill: white;
        stroke: #222;
        stroke-width: 2.5;
    }

    .arrow {
        stroke: #222;
        stroke-width: 2;
        fill: none;
        marker-end: url(#arrow);
    }

    .text {
        font-size: 16px;
        text-anchor: middle;
        dominant-baseline: middle;
    }

    .label {
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="page">

<h1>State Chart Diagram – Calorie Tracking System</h1>

<svg viewBox="0 0 800 900"
     xmlns="http://www.w3.org/2000/svg">

    <defs>
        <marker id="arrow"
                markerWidth="10"
                markerHeight="10"
                refX="9"
                refY="3"
                orient="auto">
            <path d="M0,0 L10,3 L0,6 Z"
                  fill="#222"/>
        </marker>
    </defs>


    <!-- START -->

    <circle cx="400" cy="45"
            r="15"
            fill="#222"/>


    <!-- PROFILE -->

    <rect class="state"
          x="275" y="90"
          width="250"
          height="60"
          rx="30"/>

    <text class="text"
          x="400" y="120">
        Profile Created
    </text>


    <!-- GOAL -->

    <rect class="state"
          x="275" y="210"
          width="250"
          height="60"
          rx="30"/>

    <text class="text"
          x="400" y="240">
        Goal Set
    </text>


    <!-- MEAL -->

    <rect class="state"
          x="275" y="330"
          width="250"
          height="60"
          rx="30"/>

    <text class="text"
          x="400" y="360">
        Meal Recorded
    </text>


    <!-- CALCULATION -->

    <rect class="state"
          x="250" y="450"
          width="300"
          height="60"
          rx="30"/>

    <text class="text"
          x="400" y="480">
        Calories & Nutrition Calculated
    </text>


    <!-- TRACKING -->

    <rect class="state"
          x="275" y="570"
          width="250"
          height="60"
          rx="30"/>

    <text class="text"
          x="400" y="600">
        Progress Tracked
    </text>


    <!-- DASHBOARD -->

    <rect class="state"
          x="275" y="690"
          width="250"
          height="60"
          rx="30"/>

    <text class="text"
          x="400" y="720">
        Dashboard Updated
    </text>


    <!-- END -->

    <circle cx="400" cy="840"
            r="22"
            fill="white"
            stroke="#222"
            stroke-width="4"/>

    <circle cx="400" cy="840"
            r="11"
            fill="#222"/>


    <!-- ================= ARROWS ================= -->

    <!-- Start -> Profile -->
    <line class="arrow"
          x1="400" y1="60"
          x2="400" y2="90"/>


    <!-- Profile -> Goal -->
    <line class="arrow"
          x1="400" y1="150"
          x2="400" y2="210"/>

    <text class="label"
          x="430" y="180">
        set goal
    </text>


    <!-- Goal -> Meal -->
    <line class="arrow"
          x1="400" y1="270"
          x2="400" y2="330"/>

    <text class="label"
          x="445" y="300">
        record meal
    </text>


    <!-- Meal -> Calculation -->
    <line class="arrow"
          x1="400" y1="390"
          x2="400" y2="450"/>

    <text class="label"
          x="475" y="420">
        calculate
    </text>


    <!-- Calculation -> Tracking -->
    <line class="arrow"
          x1="400" y1="510"
          x2="400" y2="570"/>

    <text class="label"
          x="465" y="540">
        update
    </text>


    <!-- Tracking -> Dashboard -->
    <line class="arrow"
          x1="400" y1="630"
          x2="400" y2="690"/>

    <text class="label"
          x="475" y="660">
        display
    </text>


    <!-- Dashboard -> End -->
    <line class="arrow"
          x1="400" y1="750"
          x2="400" y2="818"/>

</svg>

</div>

</body>
</html>
