<!DOCTYPE html>
<html>
<head>
    <title>Simple Use Case Diagram</title>

    <style>
        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 1200px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        svg {
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
        }

        .system {
            fill: #fafafa;
            stroke: #222;
            stroke-width: 3;
        }

        .usecase {
            fill: white;
            stroke: #222;
            stroke-width: 2;
        }

        .line {
            stroke: #333;
            stroke-width: 2;
        }

        text {
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

<div class="page">

<h1>Use Case Model</h1>

<svg viewBox="0 0 1200 700">

    <!-- SYSTEM -->
    <rect class="system"
          x="300" y="50"
          width="600" height="600"
          rx="10"/>

    <text x="600" y="85"
          text-anchor="middle"
          font-size="22"
          font-weight="bold">
        Calorie Tracking & Nutrition System
    </text>


    <!-- USE CASES -->

    <ellipse class="usecase"
             cx="450" cy="170"
             rx="110" ry="35"/>
    <text x="450" y="175"
          text-anchor="middle"
          font-size="15">
        Manage Profile
    </text>


    <ellipse class="usecase"
             cx="750" cy="170"
             rx="100" ry="35"/>
    <text x="750" y="175"
          text-anchor="middle"
          font-size="15">
        Set Goals
    </text>


    <ellipse class="usecase"
             cx="450" cy="300"
             rx="100" ry="35"/>
    <text x="450" y="305"
          text-anchor="middle"
          font-size="15">
        Record Meals
    </text>


    <ellipse class="usecase"
             cx="750" cy="300"
             rx="120" ry="35"/>
    <text x="750" y="305"
          text-anchor="middle"
          font-size="15">
        Track Calories & Nutrition
    </text>


    <ellipse class="usecase"
             cx="450" cy="430"
             rx="105" ry="35"/>
    <text x="450" y="435"
          text-anchor="middle"
          font-size="15">
        View Dashboard
    </text>


    <ellipse class="usecase"
             cx="750" cy="430"
             rx="105" ry="35"/>
    <text x="750" y="435"
          text-anchor="middle"
          font-size="15">
        Track Progress
    </text>


    <!-- USER ACTOR -->

    <!-- head -->
    <circle cx="130" cy="250" r="20"
            fill="none"
            stroke="#222"
            stroke-width="3"/>

    <!-- body -->
    <line class="line"
          x1="130" y1="270"
          x2="130" y2="330"/>

    <!-- arms -->
    <line class="line"
          x1="130" y1="285"
          x2="95" y2="310"/>

    <line class="line"
          x1="130" y1="285"
          x2="165" y2="310"/>

    <!-- legs -->
    <line class="line"
          x1="130" y1="330"
          x2="100" y2="370"/>

    <line class="line"
          x1="130" y1="330"
          x2="160" y2="370"/>

    <text x="130" y="400"
          text-anchor="middle"
          font-size="17"
          font-weight="bold">
        User
    </text>


    <!-- USER CONNECTIONS -->

    <line class="line"
          x1="150" y1="270"
          x2="350" y2="170"/>

    <line class="line"
          x1="150" y1="285"
          x2="650" y2="170"/>

    <line class="line"
          x1="150" y1="305"
          x2="350" y2="300"/>

    <line class="line"
          x1="150" y1="320"
          x2="630" y2="300"/>

    <line class="line"
          x1="150" y1="340"
          x2="350" y2="430"/>

    <line class="line"
          x1="150" y1="350"
          x2="645" y2="430"/>


    <!-- NUTRITIONIST -->

    <circle cx="1030" cy="250" r="20"
            fill="none"
            stroke="#222"
            stroke-width="3"/>

    <line class="line"
          x1="1030" y1="270"
          x2="1030" y2="330"/>

    <line class="line"
          x1="1030" y1="285"
          x2="995" y2="310"/>

    <line class="line"
          x1="1030" y1="285"
          x2="1065" y2="310"/>

    <line class="line"
          x1="1030" y1="330"
          x2="1000" y2="370"/>

    <line class="line"
          x1="1030" y1="330"
          x2="1060" y2="370"/>

    <text x="1030" y="400"
          text-anchor="middle"
          font-size="17"
          font-weight="bold">
        Nutritionist
    </text>


    <line class="line"
          x1="1010" y1="275"
          x2="570" y2="430"/>


    <!-- ADMIN -->

    <circle cx="1030" cy="500" r="20"
            fill="none"
            stroke="#222"
            stroke-width="3"/>

    <line class="line"
          x1="1030" y1="520"
          x2="1030" y2="580"/>

    <line class="line"
          x1="1030" y1="535"
          x2="995" y2="555"/>

    <line class="line"
          x1="1030" y1="535"
          x2="1065" y2="555"/>

    <line class="line"
          x1="1030" y1="580"
          x2="1000" y2="620"/>

    <line class="line"
          x1="1030" y1="580"
          x2="1060" y2="620"/>

    <text x="1030" y="645"
          text-anchor="middle"
          font-size="17"
          font-weight="bold">
        Admin
    </text>


    <line class="line"
          x1="1010" y1="500"
          x2="850" y2="170"/>

</svg>

</div>

</body>
</html>
