<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UML Diagrams - Calorie Tracking System</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}header{padding:25px 30px 15px;text-align:center}header h1{margin:0;font-size:30px}header p{margin:8px 0 0;color:#aaa;font-size:15px}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:15px 25px 20px}.diagram-btn{border:1px solid #444;background:#1c1c1c;color:#ddd;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}.diagram-btn:hover{background:#292929;color:#fff;transform:translateY(-1px)}.diagram-btn.active{background:#fff;color:#111;border-color:#fff}.viewer{margin:0 25px 25px;height:calc(100vh - 190px);min-height:550px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}iframe{width:100%;height:100%;border:none;background:#fff}.status{position:fixed;bottom:12px;right:20px;background:rgba(30,30,30,.9);color:#aaa;padding:7px 12px;border-radius:6px;font-size:12px}@media(max-width:700px){header h1{font-size:22px}.buttons{padding:10px}.diagram-btn{padding:10px 13px;font-size:13px}.viewer{margin:0 10px 20px;height:calc(100vh - 230px)}}
</style>
</head>
<body>
<header><h1>Calorie Tracking &amp; Nutrition Management System</h1><p>UML Diagrams</p></header>
<div class="buttons">
<button class="diagram-btn active" onclick="loadDiagram('usecase.html',this)">1. Use Case</button>
<button class="diagram-btn" onclick="loadDiagram('classdiagram.html',this)">2. Class Diagram</button>
<button class="diagram-btn" onclick="loadDiagram('interaction-diagram.html',this)">3. Interaction</button>
<button class="diagram-btn" onclick="loadDiagram('activitydiagram.html',this)">4. Activity</button>
<button class="diagram-btn" onclick="loadDiagram('statediagram.html',this)">5. State Chart</button>
</div>
<div class="viewer"><iframe id="diagramFrame" src="usecase.html" title="UML Diagram Viewer"></iframe></div>
<div class="status" id="status">Showing: Use Case Diagram</div>
<script>
const names={'usecase.html':'Use Case Diagram','classdiagram.html':'Class Diagram','interaction-diagram.html':'Interaction Diagram','activitydiagram.html':'Activity Diagram','statediagram.html':'State Chart Diagram'};
function loadDiagram(file,button){document.getElementById('diagramFrame').src=file;document.querySelectorAll('.diagram-btn').forEach(btn=>btn.classList.remove('active'));button.classList.add('active');document.getElementById('status').textContent='Showing: '+names[file]}
</script>
</body>
</html>
